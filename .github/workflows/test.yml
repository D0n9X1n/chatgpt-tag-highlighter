name: Tests

# CI for every pull request and every push to main: build both bundles once,
# then run the Playwright suite on the Chrome bundle, lint the Firefox bundle,
# and check the wiki + release tooling. `CI status` is the single aggregate
# check to require in branch protection.
#
# The release workflow does not re-run this; it requires a green run of this
# workflow on main for the exact tagged commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (chrome + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Check manifests and CHANGELOG agree
        id: version
        timeout-minutes: 1
        run: python3 scripts/release-check.py --github-output

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: JS syntax check
        timeout-minutes: 1
        run: for f in src/*.js; do node --check "$f"; done

      - name: Build chrome + firefox bundles
        timeout-minutes: 2
        run: ./publish.sh --version "${{ steps.version.outputs.version }}"

      - name: Verify required files are present in built bundles
        timeout-minutes: 1
        run: |
          for d in dist/chrome dist/firefox; do
            for f in manifest.json content.js background.js options.html options.js options.css icon.png icon-128.png; do
              [ -f "$d/$f" ] || { echo "::error::Missing $d/$f"; exit 1; }
            done
          done

      - name: Upload chrome bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: dist-chrome
          path: dist/chrome/
          if-no-files-found: error
          retention-days: 14

      - name: Upload firefox bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: dist-firefox
          path: dist/firefox/
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged archives (.zip + .xpi)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: dist-archives
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error
          retention-days: 14

  test-chrome:
    name: Test (chrome / playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Download chrome bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 3
        with:
          name: dist-chrome
          path: dist/chrome

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 3
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install python deps
        timeout-minutes: 3
        run: pip install -r tests/requirements.txt

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ~/.cache/ms-playwright
          key: ci-v1-${{ runner.os }}-playwright-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Playwright Chromium (with system deps)
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium

      - name: Save Playwright browsers (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Run pytest under Xvfb
        # MV3 extensions don't load reliably under --headless=new, so the
        # suite runs headed against a virtual display.
        timeout-minutes: 10
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" pytest tests/test_extension.py -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

  lint-firefox:
    name: Lint (firefox / web-ext)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download firefox bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 3
        with:
          name: dist-firefox
          path: dist/firefox

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: web-ext lint (errors fail the build)
        timeout-minutes: 5
        run: npx --yes web-ext@8.3.0 lint --source-dir dist/firefox --warnings-as-errors=false --self-hosted

  docs:
    name: Wiki + release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Check wiki pages
        timeout-minutes: 1
        run: python3 scripts/check-wiki.py wiki

      - name: Self-test wiki publishing
        timeout-minutes: 2
        run: bash scripts/test-wiki-publish.sh

      - name: Self-test release checks
        timeout-minutes: 1
        run: |
          bash scripts/test-release-check.sh
          set -e
          version=$(python3 -c "import json; print(json.load(open('src/manifest.chrome.json'))['version'])")
          python3 scripts/release-check.py --tag "v$version" --notes "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          python3 scripts/release-check.py --tag "v$version-rc.1" | grep -q 'prerelease=true'
          if python3 scripts/release-check.py --tag v0.0.0 2>/dev/null; then
            echo "::error::release-check accepted a tag that doesn't match the manifests"; exit 1
          fi

  ci-status:
    name: CI status
    if: always()
    needs: [build, test-chrome, lint-firefox, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        timeout-minutes: 1
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a CI job did not succeed ($r)"; exit 1; }
          done
