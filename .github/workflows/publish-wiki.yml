name: Publish wiki

# wiki/ in this repo is the only source for the GitHub wiki. On every push to
# main, mirror it into the wiki repo's master branch (pages removed from wiki/
# are removed from the wiki too). Uses only the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that pushes Git content; the write grant is scoped here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Check wiki pages
        timeout-minutes: 2
        run: python3 scripts/check-wiki.py wiki

      - name: Clone wiki repository
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki-repo

      - name: Build wiki mirror
        id: mirror
        timeout-minutes: 5
        run: scripts/publish-wiki.sh wiki wiki-repo "$GITHUB_SHA"

      - name: Push wiki mirror
        if: steps.mirror.outputs.changed == 'true'
        timeout-minutes: 5
        run: git -C wiki-repo push origin HEAD:master
